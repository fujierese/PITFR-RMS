name: Deploy to GoDaddy

# Deploys main to the GoDaddy cPanel server on every push to main.
# Can also be started by hand from the Actions tab.
# Setup steps: docs/DEPLOYMENT.md
#
# This does not wait for "PITFR CI": that workflow currently fails at
# `composer audit` (known advisories in locked packages), which would block
# every deploy. A PHP syntax check below guards against broken code instead.
# Once CI is green again, this can switch back to a workflow_run trigger.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.GODADDY_SSH_HOST }}
      SSH_USER: ${{ secrets.GODADDY_SSH_USER }}
      SSH_PORT: ${{ secrets.GODADDY_SSH_PORT || '22' }}
      APP_PATH: ${{ secrets.GODADDY_APP_PATH }}
      PHP_BIN: ${{ secrets.GODADDY_PHP_BIN || 'php' }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Check deploy secrets
        id: config
        env:
          HAS_KEY: ${{ secrets.GODADDY_SSH_KEY != '' }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$APP_PATH" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Deploy skipped: GODADDY_SSH_HOST, GODADDY_SSH_USER, GODADDY_SSH_KEY and GODADDY_APP_PATH secrets are required (see docs/DEPLOYMENT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup PHP
        if: steps.config.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Setup Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Check PHP syntax
        if: steps.config.outputs.ready == 'true'
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Build release archive (vendor + public/build)
        if: steps.config.outputs.ready == 'true'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-scripts
          npm ci
          npm run build
          tar -czf pitfr-release.tgz vendor public/build
          ls -lh pitfr-release.tgz

      - name: Configure SSH
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.GODADDY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GODADDY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Tolerate common paste damage: CRLF, indentation, text around the
          # key, or the whole key collapsed onto one line.
          key=$(printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed -n '/-----BEGIN/,/-----END/p')
          if [ -n "$key" ] && [ "$(printf '%s\n' "$key" | wc -l)" -lt 3 ]; then
            body=$(printf '%s' "$key" | sed -E 's/-----(BEGIN|END) OPENSSH PRIVATE KEY-----//g' | tr -d ' \t\n')
            key=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$(printf '%s' "$body" | fold -w 70)")
          fi
          printf '%s\n' "$key" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            # Safe diagnostics only: never print the key itself.
            echo "Secret length: ${#SSH_KEY} chars, $(printf '%s\n' "$SSH_KEY" | wc -l) lines"
            printf '%s\n' "$SSH_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY' && echo "BEGIN line: found" || echo "BEGIN line: MISSING"
            printf '%s\n' "$SSH_KEY" | grep -q 'END OPENSSH PRIVATE KEY' && echo "END line: found" || echo "END line: MISSING"
            printf '%s\n' "$SSH_KEY" | grep -q '^ssh-ed25519 ' && echo "This looks like the PUBLIC key; the secret needs the PRIVATE key."
            echo "::error::GODADDY_SSH_KEY is not a valid private key. Re-paste the whole key, including the BEGIN/END lines."
            exit 1
          fi
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host godaddy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Upload release archive
        if: steps.config.outputs.ready == 'true'
        run: ssh godaddy 'cat > ~/pitfr-release.tgz' < pitfr-release.tgz

      - name: Pull code and run deploy.sh on the server
        if: steps.config.outputs.ready == 'true'
        run: |
          ssh godaddy "set -e
            cd '$APP_PATH'
            git fetch --quiet origin main
            git merge --ff-only '$DEPLOY_SHA'
            PHP_BIN='$PHP_BIN' bash deploy.sh ~/pitfr-release.tgz"
